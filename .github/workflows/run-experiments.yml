name: Run All Qubit Experiments

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-experiments:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Qiskit and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Experiments 1 to 10/requirements.txt"
          pip install nbconvert ipykernel

      - name: Execute all 10 notebooks
        run: |
          mkdir -p executed_notebooks

          for n in {1..10}; do
            notebook=$(find "Experiments 1 to 10" -maxdepth 1 \
              -name "experiment_${n}_*.ipynb" \
              -print -quit)

            echo "======================================"
            echo "Running Experiment $n"
            echo "$notebook"
            echo "======================================"

            jupyter nbconvert \
              --to notebook \
              --execute "$notebook" \
              --output-dir executed_notebooks \
              --ExecutePreprocessor.timeout=300 \
              --ExecutePreprocessor.kernel_name=python3

            cp "executed_notebooks/$(basename "$notebook")" \
               "$notebook"

            echo "Experiment $n completed."
          done

      - name: Commit executed notebooks back to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Experiments 1 to 10/"*.ipynb

          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Execute all Qiskit experiments"
            git push
          fi
