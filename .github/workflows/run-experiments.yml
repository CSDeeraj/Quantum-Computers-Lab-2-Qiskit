name: Run All Qubit Experiments

on:
  workflow_dispatch:

jobs:
  run-experiments:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Qiskit and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Experiments 1 to 10/requirements.txt"
          pip install nbconvert ipykernel

      - name: Execute all notebooks
        run: |
          mkdir -p executed_notebooks

          for n in {1..10}; do
            notebook=$(find "Experiments 1 to 10" -maxdepth 1 -name "experiment_${n}_*.ipynb" -print -quit)

            echo "======================================"
            echo "Running experiment $n"
            echo "$notebook"
            echo "======================================"

            jupyter nbconvert \
              --to notebook \
              --execute "$notebook" \
              --output "$(basename "$notebook")" \
              --output-dir executed_notebooks \
              --ExecutePreprocessor.timeout=300

            echo "Experiment $n completed."
          done

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-qubit-experiments
          path: executed_notebooks/
